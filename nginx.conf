#sudo ln -s /var/www/booking-2026/nginx.conf /etc/nginx/sites-enabled/booking-2026.conf
server {
    server_name acmm57.pullrope.net;
    # Never serve version control or hidden files, even inside published apps
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Parts application: Flask behind uWSGI
    location / {
        include uwsgi_params;
        uwsgi_pass unix:/tmp/booking-2026.sock;
    }
    location /static{
        root /var/www/booking-2026/;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/acmm57.pullrope.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/acmm57.pullrope.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = acmm57.pullrope.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name acmm57.pullrope.net;
    listen 80;
    return 404; # managed by Certbot


}