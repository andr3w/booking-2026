#sudo ln -s /var/www/boooking-2026/uwsgi.ini /etc/uwsgi/apps-enabled/
[uwsgi]
module = server:app
chdir = /var/www/booking-2026
virtualenv = /var/www/booking-2026/venv
plugins = python3
socket = /tmp/booking-2026.sock
processes = 2
master = true
vacuum = true
die-on-term = true
touch-reload = /tmp/booking-2026.touchme
